{% extends "template.html" %}

{% block content %}
<div class="row">
  <div class="col">
    <h2>Add Item</h2>
    <form action="{% url 'todo:add_todo' %}" method="post" class="form-inline">
      {% csrf_token %}
      <input
        type="text"
        class="form-control mb-2 mr-sm-2"
        placeholder="type here..."
        name="text"
        required
      >
      <button type="submit" class="btn btn-primary mb-2">Submit</button>
    </form>
  </div>
</div>
<div class="row mt-4">
  <div class="col">
    {% if todo_list %}
    <ul class="list-group">
      {% for item in todo_list %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ item.text }}
        <form action="{% url 'todo:delete_todo' item.id %}" method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm btn-danger delete_button" aria-label="Delete">
            <i class="fa fa-trash" aria-hidden="true"></i>
          </button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
      <p>Create your first To Do item.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
